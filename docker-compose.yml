services:
  db:
    image: mariadb:lts
    environment:
      MARIADB_DATABASE: toptex
      MARIADB_USER: toptex
      MARIADB_PASSWORD: toptex
      MARIADB_ROOT_PASSWORD: toptex_root
    volumes:
      - toptex_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: toptex
      WORDPRESS_DB_PASSWORD: toptex
      WORDPRESS_DB_NAME: toptex
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_MEMORY_LIMIT', '512M' );
    volumes:
      - toptex_wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/toptex-for-woocommerce

  cli:
    image: wordpress:cli
    depends_on:
      - wordpress
      - db
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: toptex
      WORDPRESS_DB_PASSWORD: toptex
      WORDPRESS_DB_NAME: toptex
    volumes:
      - toptex_wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/toptex-for-woocommerce

volumes:
  toptex_db:
  toptex_wp:
